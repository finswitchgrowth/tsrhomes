name: TSR Homes Multi-Agent Quality Gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  architecture-agent:
    name: Agent 1 — Architecture & production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  three-ui-agent:
    name: Agent 2 — Three.js / UI / assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: test -f index.html
      - run: test -f logo-primary.b64
      - run: test -f logo-badge.b64
      - run: test -f src/tsr-engine.js
      - run: grep -q "from 'three'" src/tsr-engine.js
      - run: grep -q 'three' package.json
      - run: grep -q 'WebGLRenderer' src/tsr-engine.js
      - run: grep -q 'web3forms.com/submit' src/tsr-engine.js

  seo-agent:
    name: Agent 3 — SEO / discoverability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -q 'TSR Homes' index.html
      - run: grep -q 'True Star Realty Homes' index.html
      - run: grep -q 'True Town Villa' index.html
      - run: grep -q 'application/ld+json' index.html
      - run: grep -q 'canonical' index.html
      - run: test -f robots.txt
      - run: test -f sitemap.xml

  security-agent:
    name: Agent 4 — Security / deployment hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: '! grep -RniE "(sk-|ghp_|github_pat_|BEGIN PRIVATE KEY|password=|api_key=)" --include="*.js" --include="*.html" --include="*.json" --exclude-dir=.git .'
      - run: test ! -f vercel.json

  conversion-agent:
    name: Agent 5 — Lead conversion / fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -q 'TSR_WEB3FORMS_KEY' index.html
      - run: grep -q 'wa.me' src/tsr-engine.js
      - run: grep -q 'Smart Match' index.html

  final-review:
    name: Agent 6 — Final cross-check
    needs: [architecture-agent, three-ui-agent, seo-agent, security-agent, conversion-agent]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All TSR Homes quality gates passed. Ready for Vercel deployment."
